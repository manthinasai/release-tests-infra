    - name: results
      workspace: data
      subPath: results
    when:
      - input: $(params.UNINSTALL_PIPELINES_OPERATOR)
        operator: in
        values: ["true", "True"]

  finally:
    - name: upload-artifacts-gcs
      onError: continue
      timeout: 10m
      params:
        - name: PIPELINE_RUN_NAME
          value: $(context.pipelineRun.name)
        - name: OPERATOR_VERSION
          value: $(params.OPERATOR_VERSION)
        - name: IMAGE
          value: $(params.IMAGE)
      taskRef:
        name: upload-artifacts-gcs
      workspaces:
        - name: results
          workspace: data
          subPath: results

    - name: send-slack-notification
      onError: continue
      params:
        - name: IMAGE
          value: $(params.POST_TEST_IMAGE)
        - name: ENABLED
          value: $(params.SEND_SLACK_NOTIFICATION)
        - name: AGGREGATE_TASKS_STATUS
          value: "$(tasks.status)"
        - name: MESSAGE
          value: |
            <icon> acceptance-tests <pr_name> *<run_status>* <icon> <<logs_url>|logs> <failed_suites>
      taskRef:
        name: send-slack-notification
      when:
      - input: $(params.SEND_SLACK_NOTIFICATION)
        operator: in
        values: ["true", "True"]
      workspaces:
        - name: results
          workspace: data
          subPath: results

