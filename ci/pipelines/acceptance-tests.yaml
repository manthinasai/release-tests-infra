  - name: uninstall-pipelines-operator
    onError: continue
    params:
    - name: ARCH
      value: $(params.ARCH)
    - name: CATALOG_SOURCE
      value: $(params.CATALOG_SOURCE)
    - name: CHANNEL
      value: $(params.CHANNEL)
    - name: CLUSTER_NAME
      value: $(params.CLUSTER_NAME)
    - name: FAIL_ON_ERROR
      value: "True"
    - name: IMAGE
      value: $(params.IMAGE)
    - name: TKN_DOWNLOAD_URL
      value: $(params.TKN_DOWNLOAD_URL)
    - name: OSP_VERSION
      value: $(params.OPERATOR_VERSION)
    - name: GIT_RELEASE_TESTS_BRANCH
