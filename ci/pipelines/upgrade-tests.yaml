      subPath: results

  # ============================================================
  # Finally: destroy cluster + slack + cleanup
  # ============================================================
  finally:
    - name: upload-artifacts-gcs
      onError: continue
      timeout: 10m
      params:
        - name: PIPELINE_RUN_NAME
          value: $(context.pipelineRun.name)
        - name: OPERATOR_VERSION
          value: $(params.UPGRADE_VERSION)
        - name: IMAGE
          value: $(params.IMAGE)
      taskRef:
        name: upload-artifacts-gcs
      workspaces:
        - name: results
          workspace: data
          subPath: results

    - name: destroy-cluster
      onError: continue
      timeout: 30m
      params:
        - name: CLUSTER_NAME
          value: $(tasks.provision-cluster.results.cluster-name)
        - name: KEEP_CLUSTER
          value: $(params.KEEP_CLUSTER)
        - name: ARCH
          value: $(params.ARCH)
      taskRef:
        name: destroy-cluster

    - name: send-slack-notification
      onError: continue
      params:
        - name: IMAGE
          value: $(params.POST_TEST_IMAGE)
        - name: ENABLED
          value: $(params.SEND_SLACK_NOTIFICATION)
        - name: MESSAGE
          value: |
            <icon> upgrade-tests <pr_name> *<run_status>* <icon> <<logs_url>|logs> <failed_suites>
      taskRef:
        name: send-slack-notification
      when:
        - input: $(params.SEND_SLACK_NOTIFICATION)
          operator: in
          values: ["true", "True"]
      workspaces:
        - name: results
          workspace: data
          subPath: results

    - name: cleanup-pipelinerun
      onError: continue
      timeout: 10m
      params:
        - name: PIPELINE_RUN
          value: $(context.pipelineRun.name)
        - name: DELETE_DELAY
          value: "300"
      taskRef:
        name: cleanup-pipelinerun
